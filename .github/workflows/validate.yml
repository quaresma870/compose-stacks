name: Validate Stacks

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Docker Compose files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Create .env files from .env.example for validation
        run: |
          find stacks/ -name ".env.example" | while read f; do
            dir=$(dirname "$f")
            cp "$f" "$dir/.env"
            echo "  Created $dir/.env"
          done

      - name: Validate all docker-compose.yml files
        run: |
          echo "Validating compose files..."
          find stacks/ -name "docker-compose.yml" | sort | while read f; do
            echo -n "  Checking $f ... "
            docker compose -f "$f" config --quiet 2>/dev/null && echo "OK" || { echo "FAILED"; exit 1; }
          done
          echo "All compose files valid."

      - name: Confirm every bind-mount source path actually exists on disk
        # `docker compose config --quiet` (the step above) validates YAML
        # syntax and variable interpolation, but does NOT require
        # bind-mount source paths to exist — Compose only needs that at
        # real `up` time. This is exactly the class of gap issue #12
        # found (security and full-stack's docker-compose.yml files
        # referenced eight ./config/... paths that didn't exist anywhere
        # in the repo, undetected by the step above, undeployable as
        # committed) — this step exists specifically so that class of
        # gap can't silently recur for a new stack added later.
        #
        # Stdlib-only Python, no PyYAML dependency, matching the existing
        # ci/wait_healthy.py helper's own convention (this repo doesn't
        # otherwise depend on any Python packages) — a docker-compose.yml
        # bind mount source is reliably identifiable by line-based
        # parsing (starts with ./, ../, or / before the first
        # unescaped colon), without needing a full YAML parse.
        run: |
          python3 - <<'EOF'
          import re
          import sys
          from pathlib import Path

          missing = []
          for compose_file in sorted(Path("stacks").glob("*/docker-compose.yml")):
              stack_dir = compose_file.parent
              in_volumes_block = False
              for line in compose_file.read_text().splitlines():
                  stripped = line.strip()
                  if stripped == "volumes:":
                      in_volumes_block = True
                      continue
                  if in_volumes_block:
                      if not stripped.startswith("- "):
                          in_volumes_block = False
                          continue
                      entry = stripped[2:]
                      # Only repo-relative bind mounts (./..., ../...)
                      # are checked here — absolute host paths like
                      # /var/log/auth.log, /run/docker.sock, or
                      # /var/lib/docker (used by fail2ban, promtail, and
                      # cadvisor respectively) are legitimately expected
                      # to exist only on the real deployment host, never
                      # in this repo or in a CI runner, and checking
                      # those would produce exactly the false positives
                      # this step's own local dry-run caught before this
                      # exclusion was added — confirmed by actually
                      # running the checker against this repo's current
                      # state, not assumed from reading the compose
                      # files alone. A named volume reference (e.g.
                      # "postgres_data:/var/...", no leading . or /) is
                      # correctly skipped by the same regex.
                      if not re.match(r"^\.\.?/", entry):
                          continue
                      source = entry.split(":")[0]
                      resolved = (stack_dir / source).resolve()
                      if not resolved.exists():
                          missing.append(f"{compose_file}: {source} -> {resolved} (does not exist)")

          if missing:
              print("The following bind-mount source paths do not exist on disk:")
              for m in missing:
                  print(f"  {m}")
              sys.exit(1)
          print("All bind-mount source paths exist.")
          EOF

      - name: Validate shell scripts
        run: |
          echo "Validating shell scripts..."
          find scripts/ -name "*.sh" | while read f; do
            echo -n "  Checking $f ... "
            bash -n "$f" && echo "OK" || { echo "FAILED"; exit 1; }
          done
          echo "All scripts valid."

      - name: Check for hardcoded secrets
        run: |
          echo "Checking for hardcoded passwords..."
          if grep -rn "password:" stacks/ --include="docker-compose.yml" | \
             grep -v "\${" | grep -v "example" | grep -v "#"; then
            echo "WARNING: Possible hardcoded passwords in compose files"
          else
            echo "No hardcoded passwords found."
          fi

      - name: Cleanup .env files
        if: always()
        run: find stacks/ -name ".env" -not -name ".env.example" -delete


  smoke-test-web-basic:
    name: Boot web-basic for real (not just config --quiet)
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: stacks/web-basic
    steps:
      - uses: actions/checkout@v6

      - name: Generate secrets
        run: |
          mkdir -p secrets
          openssl rand -hex 32 > secrets/postgres_password.txt
          openssl rand -hex 24 > secrets/redis_password.txt

      - name: Configure environment
        run: cp .env.example .env

      - name: Boot postgres + redis
        run: |
          # Scoped to postgres+redis specifically — they're the stateful
          # services where secrets/healthchecks/dependency-ordering
          # actually matter and are worth proving boot correctly for real,
          # not just that `docker compose config` can parse the YAML.
          #
          # app/nginx are deliberately out of scope for this pass: app is
          # a user-replaceable placeholder with no real application logic
          # to validate, and nginx's config requires real TLS certs to
          # even start — both are genuine further work, not done here.
          docker compose -f docker-compose.yml up -d postgres redis

      - name: Wait for postgres + redis to report healthy
        run: |
          MAX_WAIT=180
          ELAPSED=0
          while true; do
            UNHEALTHY=$(docker compose -f docker-compose.yml ps --format json \
              | python3 ci/wait_healthy.py)
            if [ -z "$UNHEALTHY" ]; then
              echo "postgres + redis healthy."
              break
            fi
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "Timed out waiting for: $UNHEALTHY"
              docker compose -f docker-compose.yml ps
              exit 1
            fi
            echo "Waiting on: $UNHEALTHY ... (${ELAPSED}s/${MAX_WAIT}s)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

      - name: Verify postgres is actually accepting real connections
        run: |
          # Source .env so this reflects whatever's actually configured —
          # ${POSTGRES_USER:-app} in this shell would silently default to
          # "app" regardless of .env's real value (this shell never
          # otherwise sees Compose's own .env interpolation), which
          # happens to match today's .env.example default by coincidence,
          # not by correctness.
          set -a; source .env; set +a
          docker compose -f docker-compose.yml exec -T postgres \
            psql -U "${POSTGRES_USER:-app}" -d "${POSTGRES_DB:-app}" -c "SELECT 1;"

      - name: Verify redis is actually accepting real connections
        run: |
          docker compose -f docker-compose.yml exec -T redis \
            sh -c 'redis-cli -a "$(cat /run/secrets/redis_password)" set ci_smoke_test ok && redis-cli -a "$(cat /run/secrets/redis_password)" get ci_smoke_test'

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v


  smoke-test-blackbox-exporter:
    name: Boot monitoring's blackbox-exporter for real (closes #15)
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: stacks/monitoring
    steps:
      - uses: actions/checkout@v6

      - name: Generate secrets
        run: |
          mkdir -p secrets
          openssl rand -hex 16 > secrets/grafana_password.txt

      - name: Configure environment
        run: cp .env.example .env

      - name: Boot prometheus + blackbox-exporter
        run: docker compose -f docker-compose.yml up -d prometheus blackbox-exporter

      - name: Wait for prometheus + blackbox-exporter to report healthy
        run: |
          MAX_WAIT=120
          ELAPSED=0
          while true; do
            UNHEALTHY=$(docker compose -f docker-compose.yml ps --format json \
              | python3 - <<'EOF'
          import json, sys
          raw = sys.stdin.read().strip()
          containers = []
          if raw:
              try:
                  data = json.loads(raw)
                  containers = data if isinstance(data, list) else [data]
              except json.JSONDecodeError:
                  containers = [json.loads(l) for l in raw.splitlines() if l.strip()]
          unhealthy = [c.get("Service", c.get("Name", "?")) for c in containers
                       if c.get("Health") and c.get("Health") != "healthy"]
          print(",".join(unhealthy))
          EOF
            )
            if [ -z "$UNHEALTHY" ]; then
              echo "prometheus + blackbox-exporter healthy."
              break
            fi
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "Timed out waiting for: $UNHEALTHY"
              docker compose -f docker-compose.yml ps
              exit 1
            fi
            echo "Waiting on: $UNHEALTHY ... (${ELAPSED}s/${MAX_WAIT}s)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

      - name: Verify blackbox-exporter actually produces probe_ssl_earliest_cert_expiry
        # This is exactly the metric issue #15 found nothing in the stack ever
        # produced — probing the exporter's own /probe endpoint directly (from
        # inside prometheus's container, over the internal monitoring network,
        # the same path Prometheus's own scrape uses) proves it's now real,
        # not just that the service boots.
        run: |
          OUTPUT=$(docker compose -f docker-compose.yml exec -T prometheus \
            wget -qO- "http://blackbox-exporter:9115/probe?target=https://example.com&module=http_2xx")
          echo "$OUTPUT" | grep -q "^probe_success 1" || { echo "probe did not succeed:"; echo "$OUTPUT"; exit 1; }
          LINE=$(echo "$OUTPUT" | grep "^probe_ssl_earliest_cert_expiry ")
          echo "$LINE"
          VALUE=$(echo "$LINE" | awk '{print $2}')
          python3 -c "import sys; sys.exit(0 if float('$VALUE') > 0 else 1)" \
            || { echo "probe_ssl_earliest_cert_expiry is not a real positive value: $VALUE"; exit 1; }
          echo "probe_ssl_earliest_cert_expiry = $VALUE — real metric, ssl_alerts.yml's rules now have something to evaluate."

      - name: Verify Prometheus itself scrapes the blackbox job (not just the exporter directly)
        run: |
          sleep 20
          RESULT=$(docker compose -f docker-compose.yml exec -T prometheus \
            wget -qO- 'http://localhost:9090/api/v1/query?query=probe_ssl_earliest_cert_expiry')
          echo "$RESULT"
          echo "$RESULT" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          sys.exit(0 if data.get('data', {}).get('result') else 1)
          " || { echo "Prometheus has not scraped probe_ssl_earliest_cert_expiry via the blackbox job"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=100

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v


  smoke-test-full-stack-nginx-logs:
    name: Prove Promtail ships nginx's file-based logs to Loki (closes #16)
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: stacks/full-stack
    # Scoped like smoke-test-web-basic's own nginx exclusion: booting nginx
    # itself here would additionally require real TLS certs and the full
    # app/postgres/redis dependency chain, which is genuine further work, not
    # done here (see that job's own comments for the same reasoning). What
    # this proves instead: a log line written to the exact file path nginx
    # writes to (the shared nginx_logs volume, at /var/log/nginx/access.log)
    # is actually picked up by Promtail's new "nginx" static job and reaches
    # Loki — the precise mechanism issue #16's fix depends on, and the part
    # that was silently missing even after switching off the broken loki
    # logging driver (Promtail already mounted this volume, but no scrape
    # job ever pointed at it).
    steps:
      - uses: actions/checkout@v6

      - name: Boot loki, then promtail
        run: |
          docker compose -f docker-compose.yml up -d loki
          MAX_WAIT=60
          ELAPSED=0
          until docker compose -f docker-compose.yml exec -T loki wget -qO- http://localhost:3100/ready >/dev/null 2>&1; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then echo "loki never became ready"; docker compose -f docker-compose.yml logs loki; exit 1; fi
            sleep 3
            ELAPSED=$((ELAPSED + 3))
          done
          docker compose -f docker-compose.yml up -d promtail

      - name: Write a real log line to nginx's log file (without booting nginx itself)
        run: |
          docker compose -f docker-compose.yml run --rm --no-deps --entrypoint sh nginx -c \
            'echo "127.0.0.1 - - [21/Jul/2026:00:00:00 +0000] \"GET /ci-smoke-test HTTP/1.1\" 200 12 \"-\" \"ci-smoke-test-ua\" \"-\"" >> /var/log/nginx/access.log'

      - name: Verify Promtail shipped it and it actually reached Loki
        run: |
          MAX_WAIT=60
          ELAPSED=0
          while true; do
            RESULT=$(docker compose -f docker-compose.yml exec -T loki \
              wget -qO- 'http://localhost:3100/loki/api/v1/query_range?query={job="nginx"}&limit=10' || true)
            if echo "$RESULT" | grep -q "ci-smoke-test-ua"; then
              echo "nginx log line found in Loki via Promtail's nginx job:"
              echo "$RESULT"
              break
            fi
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "Log line never reached Loki. Last query result:"
              echo "$RESULT"
              docker compose -f docker-compose.yml logs promtail
              exit 1
            fi
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail=100 loki promtail

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
