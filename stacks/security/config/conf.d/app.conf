# HTTP → HTTPS redirect, plus ACME challenge for certbot renewal.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — this stack (unlike web-basic) doesn't bundle its own backend
# service; it's a standalone hardened reverse-proxy layer meant to sit in
# front of whatever application you deploy separately. The default block
# below serves a simple placeholder so `docker compose up` produces a
# working site out of the box, not a 502 — replace the placeholder
# `location /` block with a real `proxy_pass` once you have a backend to
# point at (see the commented example).
server {
    listen 443 ssl;
    http2  on;
    server_name example.com;   # replace with your domain

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 20M;

    # Placeholder — remove once you add a real proxy_pass below.
    location / {
        limit_req zone=general burst=20 nodelay;
        default_type text/plain;
        return 200 "nginx + CrowdSec + fail2ban are up. Point this location at your backend.\n";
    }

    # Example: proxying to a backend service on the same Docker network
    # (join it to this stack's `frontend` network, then uncomment):
    #
    # location /api/ {
    #     limit_req zone=api burst=10 nodelay;
    #     proxy_pass         http://app:8000;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 60s;
    # }
    #
    # location / {
    #     limit_req zone=general burst=20 nodelay;
    #     proxy_pass         http://app:8000;
    #     proxy_set_header   Host              $host;
    #     proxy_set_header   X-Real-IP         $remote_addr;
    #     proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header   X-Forwarded-Proto $scheme;
    # }
}
